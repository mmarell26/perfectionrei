<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Property Submission | Perfection REI</title>

  <style>
    body {
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background:#020308;
      color:#f9fafb;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:24px;
    }

    .card {
      max-width:520px;
      width:100%;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:16px;
      padding:28px;
    }

    h1 { margin-bottom:6px; }
    p { color:#cbd5e1; font-size:14px; }

    label {
      display:block;
      margin-top:16px;
      font-size:13px;
      color:#e5e7eb;
    }

    input, select {
      width:100%;
      margin-top:6px;
      padding:12px;
      border-radius:8px;
      border:none;
      background:#020308;
      color:#f9fafb;
      border:1px solid rgba(255,255,255,0.15);
    }

    button {
      margin-top:24px;
      width:100%;
      padding:14px;
      border-radius:999px;
      border:none;
      background:linear-gradient(135deg,#facc15,#eab308);
      font-weight:800;
      cursor:pointer;
      color:#111827;
    }

    .notice {
      margin-top:14px;
      font-size:12px;
      text-align:center;
      color:#cbd5e1;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Submit a Property</h1>
    <p>We review off-market and direct opportunities.</p>

    <form onsubmit="handleSubmit(event)">
      <label>Full Name
        <input required />
      </label>

      <label>Email
        <input type="email" required />
      </label>

      <label>Property Address
        <input required />
      </label>

      <label>Asking Price
        <input />
      </label>

      <label>Property Condition
        <select>
          <option>Livable</option>
          <option>Needs Light Rehab</option>
          <option>Heavy Rehab</option>
        </select>
      </label>

      <button type="submit">Submit Property</button>

      <div class="notice">
        Submission does not guarantee an offer. All properties are reviewed internally.
      </div>
    </form>
  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      window.location.href = "/intake-next.html";
    }
  </script>
</body>
</html>
