<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit an Offer | Perfection REI</title>

  <style>
    :root {
      --bg-dark: #020308;
      --bg-panel: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.12);
      --text-main: #f9fafb;
      --text-muted: #cbd5f5;
      --gold: #f4c46a;
      --radius: 18px;
      --shadow: 0 32px 80px rgba(0,0,0,0.65);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top, #151b36 0%, var(--bg-dark) 55%);
      color: var(--text-main);
    }

    .offer-page {
      width: 100%;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
    }

    .offer-card {
      width: 100%;
      max-width: 520px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 28px;
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    .subtitle strong {
      color: var(--gold);
      font-weight: 600;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.35);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--gold);
    }

    button {
      margin-top: 26px;
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #f4c46a, #e6a93c);
      color: #1a1a1a;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.05);
    }

    .trust {
      margin-top: 18px;
      font-size: 12px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <div class="offer-page">
    <div class="offer-card">
      <h1>Submit Your Offer</h1>

      <p class="subtitle">
        Serious buyers only. All offers reviewed within 24 hours.
        <br><strong>Highest &amp; best may be selected without notice.</strong>
      </p>

      <form action="https://formsubmit.co/malik@perfectionrei.com" method="POST">
        <input type="hidden" name="_subject" value="New Offer Submitted">
        <input type="hidden" name="_next" value="https://perfectionrei.com/success.html">

        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Phone</label>
        <input type="tel" name="phone" required>

        <label>Offer Price ($)</label>
        <input type="number" name="offer_price" required>

        <label>Proof of Funds Available?</label>
        <select name="proof_of_funds" required>
          <option value="">Select</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>

        <button type="submit">Submit Offer</button>
      </form>

      <p class="trust">
        🔒 Confidential · No spam · Direct to acquisitions
      </p>
    </div>
  </div>
</body>
</html>
