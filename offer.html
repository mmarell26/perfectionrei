<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit an Offer | Perfection REI</title><meta name="robots" content="noindex,follow"><link rel="icon" href="/perfectionrei_favicon.png" type="image/png">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#182342,#03050b 52%);color:#f7f8fb;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(560px,100%);background:#0b1020;border:1px solid rgba(255,255,255,.13);border-radius:22px;padding:clamp(24px,5vw,40px)}h1{margin:0 0 8px}p{color:#b8c2d8}label{display:block;margin-top:17px;color:#b8c2d8;font-weight:700;font-size:.88rem}input,select,textarea{width:100%;box-sizing:border-box;margin-top:7px;padding:13px;background:#050814;color:#f7f8fb;border:1px solid rgba(255,255,255,.14);border-radius:10px;font:inherit}textarea{min-height:90px}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:999px;background:linear-gradient(135deg,#f4c46a,#dfa13a);font-weight:900;color:#18130a;cursor:pointer}.back{color:#f4c46a;text-decoration:none;font-weight:800}</style></head>
<body><main class="card"><a class="back" href="/offers/">← Deal Vault</a><h1>Submit your offer</h1><p>Serious buyers only. Include the property and your best terms so the acquisitions team can evaluate the offer.</p>
<form action="https://formsubmit.co/malik@perfectionrei.com" method="POST"><input type="hidden" name="_subject" value="New Perfection REI Buyer Offer"><input type="hidden" name="_next" value="https://perfectionrei.com/success.html"><input type="hidden" name="_template" value="table"><input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
<label>Full name<input name="name" autocomplete="name" required></label><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Phone<input type="tel" name="phone" autocomplete="tel" required></label><label>Property address<input name="property_address" required></label><label>Offer price<input type="number" name="offer_price" min="0" step="1000" required></label><label>Funding<select name="funding" required><option value="">Select one</option><option>Cash</option><option>Hard money</option><option>Conventional financing</option><option>Other</option></select></label><label>Proof of funds available?<select name="proof_of_funds" required><option value="">Select one</option><option>Yes</option><option>No</option></select></label><label>Terms and notes<textarea name="terms" placeholder="Deposit, inspection period, closing timeline, contingencies, and other terms"></textarea></label><button type="submit">Send Offer</button></form></main></body></html>
