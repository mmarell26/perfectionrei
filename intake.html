<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submit a Multifamily Deal | Perfection REI</title>
<meta name="description" content="Submit a 5–50 unit Philadelphia-area multifamily property to Perfection Real Estate Investors.">
<link rel="canonical" href="https://perfectionrei.com/intake.html"><link rel="icon" href="/perfectionrei_favicon.png" type="image/png">
<style>
:root{--bg:#03050b;--panel:#0b1020;--text:#f7f8fb;--muted:#b8c2d8;--gold:#f4c46a;--line:rgba(255,255,255,.13)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182342,var(--bg) 48%);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(760px,calc(100% - 28px));margin:0 auto;padding:28px 0 60px}.back{color:var(--gold);font-weight:800;text-decoration:none}.card{margin-top:24px;background:rgba(11,16,32,.94);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,5vw,42px)}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.02;letter-spacing:-.04em;margin:0 0 12px}p{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;color:var(--muted);font-size:.88rem;font-weight:700;margin-top:18px}input,select,textarea{width:100%;margin-top:7px;padding:13px 14px;background:#050814;color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:110px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}button{width:100%;margin-top:26px;min-height:52px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--gold),#dfa13a);font-weight:900;font-size:1rem;color:#18130a;cursor:pointer}.note{font-size:.8rem;text-align:center}@media(max-width:620px){.grid{grid-template-columns:1fr}.grid label{margin-top:18px}}
</style>
</head>
<body><main class="wrap"><a class="back" href="/">← Back to Perfection REI</a><section class="card">
<h1>Submit a multifamily deal</h1><p>Our current focus is 5–50 unit properties in Philadelphia and within approximately one hour. Provide what you have; we will request additional diligence if the opportunity fits.</p>
<form action="https://formsubmit.co/malik@perfectionrei.com" method="POST">
<input type="hidden" name="_subject" value="New Perfection REI Property Submission"><input type="hidden" name="_next" value="https://perfectionrei.com/intake-next.html"><input type="hidden" name="_template" value="table"><input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
<div class="grid">
<label>Full name<input name="name" autocomplete="name" required></label>
<label>Email<input type="email" name="email" autocomplete="email" required></label>
<label>Phone<input type="tel" name="phone" autocomplete="tel" required></label>
<label>Your role<select name="source_type" required><option value="">Select one</option><option>Property owner</option><option>Broker or agent</option><option>Wholesaler</option><option>Lender</option><option>Other deal source</option></select></label>
<label>Property address<input name="property_address" autocomplete="street-address" required></label>
<label>City / State<input name="city_state" required></label>
<label>Number of units<input type="number" name="unit_count" min="1" required></label>
<label>Asking price<input type="number" name="asking_price" min="0" step="1000"></label>
<label>Occupancy<select name="occupancy"><option value="">Select one</option><option>Stabilized / mostly occupied</option><option>Partially occupied</option><option>Vacant</option><option>Unknown</option></select></label>
<label>Opportunity type<select name="opportunity_type"><option value="">Select one</option><option>Value-add</option><option>Stabilized</option><option>Development / conversion</option><option>Other</option></select></label>
</div>
<label>Property details<textarea name="property_details" placeholder="Current rents, expenses, condition, renovation needs, timeline, and anything else we should know"></textarea></label>
<label>Financials or diligence link<input type="url" name="diligence_link" placeholder="Dropbox, Google Drive, offering memorandum, or listing URL"></label>
<button type="submit">Send to Acquisitions</button>
<p class="note">Confidential submission. Submission does not guarantee an offer.</p>
</form></section></main></body></html>
